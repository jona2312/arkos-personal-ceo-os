name: Desktop pilot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/Test-ArkosNeural.cjs
      - run: node scripts/Test-ArkosRemoteView.cjs
      - run: python -m unittest discover -s tests -v
      - run: python -m arkos_pilot doctor
      - run: python -m arkos_relay --help
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Start-Arkos.ps1 propose 'Quiero organizar mis tareas'
      - name: Parse PowerShell scripts and inspect desktop readiness
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          ./scripts/Get-ArkosDesktopReadiness.ps1

      - name: Guided launcher check-only on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $trialState = Join-Path $env:RUNNER_TEMP 'ArkosGuidedLauncherTrial'
          $env:PYTHON_MANAGER_AUTOMATIC_INSTALL = 'true'
          ./scripts/Open-Arkos.ps1 -StateDirectory $trialState -PythonPath (Get-Command python).Source -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'Guided preflight failed.' }
          if (Test-Path $trialState) { throw 'CheckOnly created trial state.' }
          if ($env:PYTHON_MANAGER_AUTOMATIC_INSTALL -ne 'true') { throw 'Launcher did not restore the environment.' }

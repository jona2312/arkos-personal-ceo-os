name: Desktop pilot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m arkos_pilot doctor
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Start-Arkos.ps1 propose 'Quiero organizar mis tareas'
